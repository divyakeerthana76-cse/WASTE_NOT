
services:
  api1:
    build: .
    env_file:
      - .env
    environment:
      PORT: "3000"
      INSTANCE_ID: "api1"
    ports:
      - "3001:3000"
    restart: unless-stopped

  api2:
    build: .
    env_file:
      - .env
    environment:
      PORT: "3000"
      INSTANCE_ID: "api2"
    restart: unless-stopped

  api3:
    build: .
    env_file:
      - .env
    environment:
      PORT: "3000"
      INSTANCE_ID: "api3"
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped
